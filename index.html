<head>

<title>English Booster</title>
<meta name="description" content="Reviser le vocabulaire et les notions d'anglais B3 : repetition espacee, rappel actif, formats varies, audio.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Design: iOS-style - grouped lists on a soft background, translucent chrome,
   segmented controls, one blue accent, system typography, spring-like motion. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#ececef; --elevated:#ffffff;
  --fg:#1c1c1e; --muted:#6b6b70; --faint:#a1a1a8;
  --line:rgba(60,60,67,.11); --line-2:rgba(60,60,67,.20);
  --accent:#0a7cff; --accent-press:#0a63cf; --accent-soft:#e7f0ff;
  --good:#1f9e52; --good-soft:#e3f6ea; --bad:#e23b30; --bad-soft:#fbe6e4;
  --seg-thumb:#ffffff; --glass:rgba(248,248,251,.72);
  --shadow-s:0 .5px 1px rgba(0,0,0,.05),0 2px 6px rgba(20,24,40,.05);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(20,24,40,.08);
  --r:18px; --r-s:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Inter,Roboto,sans-serif;
  --spring:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --elevated:#1c1c1e;
  --fg:#f5f5f7; --muted:#9b9ba2; --faint:#6a6a70;
  --line:rgba(120,120,128,.28); --line-2:rgba(120,120,128,.42);
  --accent:#0a84ff; --accent-press:#4aa3ff; --accent-soft:#0e2744;
  --good:#30d158; --good-soft:#10331d; --bad:#ff453a; --bad-soft:#3a1714;
  --seg-thumb:#636366; --glass:rgba(28,28,30,.7);
  --shadow-s:0 .5px 1px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --elevated:#1c1c1e;
  --fg:#f5f5f7; --muted:#9b9ba2; --faint:#6a6a70;
  --line:rgba(120,120,128,.28); --line-2:rgba(120,120,128,.42);
  --accent:#0a84ff; --accent-press:#4aa3ff; --accent-soft:#0e2744;
  --good:#30d158; --good-soft:#10331d; --bad:#ff453a; --bad-soft:#3a1714;
  --seg-thumb:#636366; --glass:rgba(28,28,30,.7);
  --shadow-s:0 .5px 1px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.1;font-weight:700;text-wrap:balance}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:52px}
.appname{font-weight:600;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.appname small{color:var(--muted);font-weight:500}
.iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);display:grid;place-items:center;color:var(--fg);transition:transform .2s var(--spring),background .2s}
.iconbtn:active{transform:scale(.9)}
.scrolledge{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:16px;z-index:19;margin-bottom:-16px;
  background:linear-gradient(var(--bg),rgba(0,0,0,0));pointer-events:none}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{padding-top:8px;animation:fade .35s var(--spring)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.large-title{font-size:32px;letter-spacing:-.03em;margin:14px 0 2px}
.subtitle{color:var(--muted);font-size:15px;margin:0 0 20px;max-width:58ch}
.group-h{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:26px 4px 9px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-s);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;border:none;background:none;text-align:left;
  padding:15px 16px;position:relative;transition:background .15s}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row:active{background:var(--surface-2)}
.row .main{min-width:0;flex:1}
.row .title{font-weight:600;font-size:16.5px;letter-spacing:-.01em}
.row .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.row .trail{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;flex:none}
.row .trail .n{font-weight:600}
.row .trail .n.due{color:var(--accent)}
.row .trail .n.ok{color:var(--good)}
.row.feature{background:var(--accent);color:#fff}
.row.feature .sub{color:rgba(255,255,255,.85)}
.row.feature .chev{color:rgba(255,255,255,.8)}
.row.feature:active{background:var(--accent-press)}
.chev{color:var(--faint);display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;
  font-weight:600;font-size:17px;letter-spacing:-.01em;padding:14px 20px;border:none;
  background:var(--surface-2);color:var(--fg);transition:transform .18s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-press)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.tinted{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%}
.btn.lg{padding:16px 22px;font-size:18px;border-radius:16px}
.btn:disabled{opacity:1}
.btn.plain{background:none;color:var(--accent);padding:10px 6px;font-size:16px}
.rowbtns{display:flex;gap:12px}
.rowbtns .btn{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:14.5px;
  letter-spacing:-.01em;padding:8px 15px;border-radius:9px;white-space:nowrap;transition:color .2s}
.seg button.on{background:var(--seg-thumb);color:var(--fg);box-shadow:var(--shadow-s)}
.study-head{display:flex;align-items:center;gap:14px;margin:6px 0 20px}
.track{flex:1;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s var(--spring)}
.pc{font-size:15px;color:var(--muted);font-weight:600}
.flash{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:34px 24px;min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.cue{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}
.term{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.08}
.term.sm{font-size:26px}
.reveal-in{animation:grow .45s var(--spring)}
@keyframes grow{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.answer{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--accent)}
.defn{font-size:15px;color:var(--muted);max-width:44ch;margin-top:-4px}
.ex{font-size:15.5px;color:var(--fg);max-width:46ch;background:var(--surface-2);border-radius:14px;padding:12px 15px;line-height:1.45}
.ex b{color:var(--accent);font-weight:700}
.blank{color:var(--accent);font-weight:700;letter-spacing:1px}
.speak{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;transition:transform .18s var(--spring)}
.speak:active{transform:scale(.88)}
.flash-foot{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.qopt{font-weight:500}
.qopt.good{background:var(--good);color:#fff}
.qopt.bad{background:var(--bad);color:#fff}
.typed{width:100%;font-size:19px;text-align:center;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line-2);
  background:var(--surface);color:var(--fg);transition:border-color .2s,background .2s}
.typed:focus{outline:none;border-color:var(--accent)}
.typed.ok{border-color:var(--good);background:var(--good-soft)}
.typed.no{border-color:var(--bad);background:var(--bad-soft)}
.verdict{font-size:16px;font-weight:600}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.hint{color:var(--muted);font-size:14px;text-align:center}
.done{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:40px 24px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.stats{display:flex;gap:30px;margin:8px 0}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em}
.stat span{font-size:13px;color:var(--muted)}
.ring{width:64px;height:64px}
.search{position:relative;margin:4px 0 2px}
.search input{width:100%;font-size:16px;padding:11px 14px 11px 40px;border-radius:12px;border:none;
  background:var(--surface-2);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent)}
.search .sic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);display:grid;place-items:center;pointer-events:none}
.lexrow{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;position:relative}
.lexrow + .lexrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.lexrow .txt{min-width:0;flex:1}
.lexrow .en{font-weight:600;font-size:16px;letter-spacing:-.01em}
.lexrow .fr{color:var(--muted);font-size:14.5px}
.lexrow .ex2{display:block;font-size:13.5px;color:var(--faint);margin-top:4px;font-style:italic}
.lexrow .sp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--accent);
  display:grid;place-items:center;border:none;transition:transform .18s var(--spring)}
.lexrow .sp:active{transform:scale(.86)}
.empty{text-align:center;color:var(--muted);padding:46px 20px}
.lesson{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-s);padding:20px 20px;margin-bottom:16px}
.lesson h3{font-size:20px;letter-spacing:-.02em}
.lesson .eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.lesson p{margin:10px 0}
.lesson ul{margin:10px 0;padding-left:20px}
.lesson li{margin:5px 0}
.lesson .exs{color:var(--muted);font-size:14.5px}
.kw{background:var(--surface-2);border-radius:6px;padding:1px 7px;font-weight:600;font-size:.94em}
.gtable{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;overflow:hidden;border-radius:12px}
.gtable th,.gtable td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:left}
.gtable th{background:var(--surface-2);font-weight:600}
.gtable tr:last-child td{border-bottom:none}
.callout{background:var(--accent-soft);border-radius:13px;padding:13px 15px;font-size:14.5px;color:var(--fg);margin-top:12px}
.quiz{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-s);padding:18px 18px;margin-bottom:14px}
.quiz .q{font-weight:600;font-size:16px;margin-bottom:12px}
.qrow{display:flex;flex-direction:column;gap:8px}
.qrow button{text-align:left;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);border-radius:11px;padding:11px 14px;font-size:15px;font-weight:500;transition:background .2s,border-color .2s,transform .15s var(--spring)}
.qrow button:active{transform:scale(.98)}
.qrow button.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qrow button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qexp{margin-top:11px;font-size:14px;color:var(--muted);display:none}
.qexp.show{display:block}
.fb-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-s);padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.note-box{background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.5}
.steps{margin:0;padding-left:20px;font-size:14.5px;color:var(--fg);line-height:1.6}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .inner{max-width:720px;margin:0 auto;display:flex}
.tabbar button{flex:1;border:none;background:none;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;font-size:10.5px;font-weight:600;letter-spacing:.01em;
  transition:color .2s,transform .2s var(--spring)}
.tabbar button:active{transform:scale(.92)}
.tabbar button.on{color:var(--accent)}
.hidden{display:none!important}
footer{color:var(--faint);font-size:12.5px;text-align:center;padding:28px 10px 8px}
@media (prefers-reduced-transparency:reduce){
  .topbar,.tabbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto}
  .view,.reveal-in{animation:none}
  .btn:active,.iconbtn:active,.speak:active,.tabbar button:active,.lexrow .sp:active,.qrow button:active{transform:none}
}
@media (prefers-contrast:more){
  :root{--line:rgba(60,60,67,.5);--line-2:rgba(60,60,67,.7)}
  .row .sub,.lexrow .fr{color:var(--fg)}
}
</style>
</head>

function $(s){return document.querySelector(s)}
function esc(s){return (s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(to|a|an|the)\b/g,'').replace(/\s+/g,' ').trim()}
function exHTML(c){
  var head=c.en.replace(/^(to|a|an|the)\s+/i,'').split(' ')[0];
  var s=esc(c.ex); if(!s)return '';
  try{s=s.replace(new RegExp('('+head.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','i'),'<b>$1</b>');}catch(e){}
  return '<div class="ex">'+s+'</div>';
}
var voices=[];
function lv(){voices=window.speechSynthesis?speechSynthesis.getVoices():[]}
if(window.speechSynthesis){lv();speechSynthesis.onvoiceschanged=lv;}
function speak(t){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,'').trim());
  u.lang='en-GB';u.rate=.9;
  var v=voices.find(function(v){return /en-GB/i.test(v.lang)})||voices.find(function(v){return /^en/i.test(v.lang)});
  if(v)u.voice=v;speechSynthesis.speak(u);
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function openSetup(deck){

  seg('#cap',function(x){S.cap=+x});
  $('#start').onclick=start;

function start(){
  var pool=poolFor(S.deck).filter(function(c){return isDue(c.id)});
  if(S.deck==='all'||S.fmt==='mix')pool=shuffle(pool); /* new cards drawn at random; reviews still come first */
  pool.sort(function(a,b){var sa=cst(a.id),sb=cst(b.id);if(sa&&!sb)return -1;if(!sa&&sb)return 1;return (sa?sa.due:0)-(sb?sb.due:0);});
  if(S.cap!==999)pool=pool.slice(0,S.cap);
  if(!pool.length)pool=poolFor(S.deck).slice(0,S.cap===999?999:S.cap);
  if(S.deck==='all'||S.fmt==='mix')pool=shuffle(pool);
  S.queue=pool.map(function(c){return c.id});S.total=S.queue.length;S.done=0;S.right=0;S.wrong=0;
  nextCard();
}
function nextCard(){
  if(!S.queue.length)return finish();
  var nid=S.queue.shift();
  S.cur=CARDS.find(function(c){return c.id===nid});
  S.fmtCur=S.fmt==='mix'?FORMATS[Math.floor(Math.random()*FORMATS.length)]:S.fmt;
  S.revealed=false;renderCard();
}
function head(){
  var pct=S.total?Math.min(100,Math.round(S.done/S.total*100)):0;
  return '<div class="study-head"><button class="iconbtn" id="quit" aria-label="Quitter">'+IC.close+'</button>'+
    '<div class="track"><i style="width:'+pct+'%"></i></div><span class="pc tnum">'+S.done+'/'+S.total+'</span></div>';
}
function bindQuit(){$('#quit').onclick=function(){S.done>0?finish():show('home')}}
function answerExtras(c){return (c.note?'<div class="defn">'+esc(c.note)+'</div>':'')+exHTML(c)}
function renderCard(){
  var f=S.fmtCur;
  if(f==='qcm')return fmtQCM();
  if(f==='write')return fmtWrite();
  if(f==='cloze')return fmtCloze();
  if(f==='dictee')return fmtDictee();
  fmtCard();
}
function fmtCard(){
  var c=S.cur,v=$('#view-study');
  v.innerHTML=head()+'<div class="flash"><span class="cue">Carte \u00b7 Anglais</span>'+
    '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center">'+
    '<span class="term '+(c.en.length>20?'sm':'')+'">'+esc(c.en)+'</span>'+
    '<button class="speak" id="sp" aria-label="\u00c9couter">'+IC.speak+'</button></div><div id="rev"></div></div>'+
    '<div class="flash-foot" id="foot"><button class="btn primary block" id="go">Afficher la r\u00e9ponse</button></div>';
  bindQuit();$('#sp').onclick=function(){speak(c.en)};
  $('#go').onclick=function(){
    S.revealed=true;
    $('#rev').innerHTML='<div class="reveal-in" style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:4px"><div class="answer">'+esc(c.fr)+'</div>'+answerExtras(c)+'</div>';
    $('#foot').innerHTML='<div class="rowbtns"><button class="btn bad" id="bad">\u00c0 revoir</button><button class="btn good" id="good">Je savais</button></div>';
    $('#good').onclick=function(){commit(true);nextCard();};$('#bad').onclick=function(){commit(false);nextCard();};
  };
}
function fmtQCM(){
  var c=S.cur,v=$('#view-study');
  var others=shuffle(poolFor(S.deck).filter(function(x){return x.id!==c.id&&x.fr!==c.fr})).slice(0,3).map(function(x){return x.fr});
  var opts=shuffle([c.fr].concat(others));
  v.innerHTML=head()+'<div class="flash" style="min-height:auto;padding-bottom:18px"><span class="cue">QCM \u00b7 Anglais</span>'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center">'+
    '<span class="term '+(c.en.length>20?'sm':'')+'">'+esc(c.en)+'</span>'+
    '<button class="speak" id="sp" aria-label="\u00c9couter">'+IC.speak+'</button></div><div id="rev"></div></div>'+
    '<div class="flash-foot" id="foot">'+opts.map(function(o){return '<button class="btn block qopt" data-ok="'+(o===c.fr?1:0)+'" style="text-align:left">'+esc(o)+'</button>'}).join('')+'</div>';
  bindQuit();$('#sp').onclick=function(){speak(c.en)};
  document.querySelectorAll('.qopt').forEach(function(b){b.onclick=function(){
    if(S.revealed)return;S.revealed=true;
    var ok=b.dataset.ok==='1';commit(ok);
    document.querySelectorAll('.qopt').forEach(function(x){x.disabled=true;if(x.dataset.ok==='1')x.classList.add('good')});
    if(!ok)b.classList.add('bad');
    $('#rev').innerHTML='<div class="reveal-in" style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px">'+answerExtras(c)+'</div>';
    var cont=document.createElement('button');cont.className='btn '+(ok?'good':'tinted')+' block';cont.textContent='Continuer';cont.style.marginTop='6px';cont.onclick=nextCard;$('#foot').appendChild(cont);
  }});
}
function fmtWrite(){
  var c=S.cur,v=$('#view-study');
  v.innerHTML=head()+'<div class="flash"><span class="cue">\u00c9cris en anglais \u00b7 Fran\u00e7ais</span>'+
    '<span class="term '+(c.fr.length>20?'sm':'')+'">'+esc(c.fr)+'</span><div id="rev"></div></div>'+
    '<div class="flash-foot" id="foot"><input class="typed" id="tp" placeholder="\u00c9cris le mot anglais\u2026" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">'+
    '<button class="btn primary block" id="ck">V\u00e9rifier</button></div>';
  bindQuit();var inp=$('#tp');setTimeout(function(){inp.focus()},50);
  var run=function(){typedCheck([c.en,c.en.replace(/\(.*?\)/g,'')],inp,'write')};
  $('#ck').onclick=run;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();S.revealed?nextCard():run();}});
}
function fmtCloze(){
  var c=S.cur,v=$('#view-study'),h=headword(c);
  var sent=c.ex,token=h,blanked=false;
  try{var re=new RegExp('\\b('+h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','i');var m=sent.match(re);if(m){token=m[1];sent=esc(c.ex).replace(re,'<span class="blank">______</span>');blanked=true;}}catch(e){}
  if(!blanked)return fmtWrite();
  v.innerHTML=head()+'<div class="flash"><span class="cue">Compl\u00e8te \u00b7 '+esc(c.fr)+'</span>'+
    '<div class="ex" style="font-size:17px">'+sent+'</div><div id="rev"></div></div>'+
    '<div class="flash-foot" id="foot"><input class="typed" id="tp" placeholder="Le mot manquant\u2026" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">'+
    '<button class="btn primary block" id="ck">V\u00e9rifier</button></div>';
  bindQuit();var inp=$('#tp');setTimeout(function(){inp.focus()},50);
  var run=function(){typedCheck([token,h],inp,'cloze')};
  $('#ck').onclick=run;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();S.revealed?nextCard():run();}});
}
function fmtDictee(){
  var c=S.cur,v=$('#view-study');
  v.innerHTML=head()+'<div class="flash"><span class="cue">Dict\u00e9e \u00b7 \u00e9coute et \u00e9cris</span>'+
    '<button class="speak" id="sp" style="width:66px;height:66px" aria-label="R\u00e9\u00e9couter">'+IC.speak+'</button><div id="rev"></div></div>'+
    '<div class="flash-foot" id="foot"><input class="typed" id="tp" placeholder="\u00c9cris ce que tu entends\u2026" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">'+
    '<button class="btn primary block" id="ck">V\u00e9rifier</button></div>';
  bindQuit();var inp=$('#tp');setTimeout(function(){inp.focus();speak(c.en);},150);
  $('#sp').onclick=function(){speak(c.en)};
  var run=function(){typedCheck([c.en,c.en.replace(/\(.*?\)/g,'')],inp,'dictee')};
  $('#ck').onclick=run;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();S.revealed?nextCard():run();}});
}
function typedCheck(accept,inp,kind){
  var c=S.cur;
  if(S.revealed)return nextCard();
  var ok=norm(inp.value)!=='' && accept.some(function(a){return norm(a)===norm(inp.value)});
  S.revealed=true;commit(ok);
  inp.classList.add(ok?'ok':'no');inp.disabled=true;
  var extra = kind==='cloze'
    ? '<div class="answer" style="font-size:20px">'+esc(c.en)+' \u2014 '+esc(c.fr)+'</div>'
    : (kind==='dictee'?'<div class="answer" style="font-size:20px">'+esc(c.fr)+'</div>':'');
  $('#rev').innerHTML='<div class="reveal-in" style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px">'+
     '<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct':'R\u00e9ponse : '+esc(accept[0]))+'</div>'+extra+answerExtras(c)+
     '<button class="speak" id="sp2" aria-label="\u00c9couter">'+IC.speak+'</button></div>';
  $('#sp2').onclick=function(){speak(c.en)};
  $('#foot').innerHTML='<button class="btn '+(ok?'good':'tinted')+' block" id="cont">Continuer</button>'+(ok?'':'<p class="hint">Cette carte reviendra bient\u00f4t.</p>');
  $('#cont').onclick=nextCard;
}
function commit(ok){
  var c=S.cur, s=cst(c.id)||{box:0}; var box=s.box||0;
  box=ok?Math.min(box+1,5):1;
  progress[c.id]={box:box,due:ok?now()+INTERVALS[box]*DAY:now(),seen:(s.seen||0)+1};
  save();S.done++; if(ok)S.right++; else{S.wrong++; if(S.queue.length<8)S.queue.push(c.id);}
}
function finish(){
  var acc=S.done?Math.round(S.right/S.done*100):0;
  var C=2*Math.PI*28, off=C*(1-acc/100);
  $('#view-study').innerHTML='<div style="height:10px"></div><div class="done">'+
    '<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--surface-2)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="28" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 32 32)"/></svg>'+
    '<h2 style="font-size:24px">S\u00e9ance termin\u00e9e</h2>'+
    '<div class="stats"><div class="stat"><b class="tnum">'+S.right+'</b><span>sues</span></div>'+
    '<div class="stat"><b class="tnum">'+S.wrong+'</b><span>\u00e0 revoir</span></div>'+
    '<div class="stat"><b class="tnum">'+acc+'%</b><span>r\u00e9ussite</span></div></div>'+
    '<p class="hint">Les cartes rat\u00e9es reviendront en priorit\u00e9.</p>'+
    '<div class="rowbtns" style="margin-top:6px;width:100%"><button class="btn block" id="again">Autre s\u00e9ance</button>'+
    '<button class="btn primary block" id="home2">Terminer</button></div></div>';
  $('#home2').onclick=function(){show('home')};$('#again').onclick=function(){openSetup(S.deck)};
}

/* ============ NOTIONS ============ */
function renderNotions(){
  var html='<h1 class="large-title">Notions</h1>'+
   '<p class="subtitle">Les r\u00e8gles tomb\u00e9es dans tes fiches. \u00c0 lire une fois, puis \u00e0 v\u00e9rifier dans le quiz.</p>'+
   NOTIONS.map(function(n){return '<div class="lesson"><div class="eyebrow">'+esc(n.tag)+'</div><h3>'+esc(n.title)+'</h3>'+n.html+'</div>'}).join('');
  html+='<div class="group-h">S\u2019entra\u00eener</div>'+
   NOTION_QUIZ.map(function(it,qi){
     return '<div class="quiz" data-qi="'+qi+'"><div class="q">'+esc(it.q)+'</div><div class="qrow">'+
       it.opts.map(function(o,oi){return '<button data-oi="'+oi+'">'+esc(o)+'</button>'}).join('')+
       '</div><div class="qexp">'+esc(it.exp)+'</div></div>';
   }).join('');
  $('#view-notions').innerHTML=html;
  document.querySelectorAll('.quiz').forEach(function(box){
    var qi=+box.dataset.qi, it=NOTION_QUIZ[qi], done=false;
    box.querySelectorAll('.qrow button').forEach(function(btn){
      btn.onclick=function(){
        if(done)return;done=true;
        var oi=+btn.dataset.oi, ok=oi===it.a;
        btn.classList.add(ok?'good':'bad');
        if(!ok)box.querySelectorAll('.qrow button')[it.a].classList.add('good');
        box.querySelector('.qexp').classList.add('show');
      };
    });
  });
}

/* ============ LEXIQUE ============ */
var lexF='all', lexQ='';
function renderLex(){
  var v=$('#view-lex');
  var segs=[['all','Tous']].concat(DECKS.map(function(d){return [d.id,d.name.split(' ')[0]]}));
  v.innerHTML='<h1 class="large-title">Lexique</h1>'+
   '<p class="subtitle">Toute la liste, avec prononciation. '+CARDS.length+' mots.</p>'+
   '<div class="search"><span class="sic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span>'+
   '<input id="lq" type="text" placeholder="Chercher un mot, une traduction\u2026" autocomplete="off" value="'+esc(lexQ)+'"></div>'+
   '<div class="seg" id="lf" style="margin:12px 0 2px">'+segs.map(function(s){return '<button class="'+(s[0]===lexF?'on':'')+'" data-v="'+s[0]+'">'+esc(s[1])+'</button>'}).join('')+'</div>'+
   '<div class="list" id="ll" style="margin-top:14px"></div>';
  var inp=$('#lq');
  inp.addEventListener('input',function(){lexQ=inp.value;fillLex();});
  seg('#lf',function(x){lexF=x;fillLex();});
  fillLex();
}
function fillLex(){
  var q=norm(lexQ);
  var list=CARDS.filter(function(c){return lexF==='all'||c.deck===lexF});
  if(q)list=list.filter(function(c){return norm(c.en).indexOf(q)>=0||norm(c.fr).indexOf(q)>=0||norm(c.note).indexOf(q)>=0});
  list=list.slice().sort(function(a,b){return a.en.replace(/^(to|a|an|the) /,'').localeCompare(b.en.replace(/^(to|a|an|the) /,''))});
  var ll=$('#ll');
  if(!list.length){ll.innerHTML='<div class="empty">Aucun mot trouv\u00e9.</div>';return;}
  ll.innerHTML=list.map(function(c){return '<div class="lexrow"><button class="sp" data-en="'+esc(c.en)+'" aria-label="\u00c9couter">'+IC.speak+'</button>'+
     '<div class="txt"><span class="en">'+esc(c.en)+'</span> \u2014 <span class="fr">'+esc(c.fr)+'</span>'+(c.ex?'<span class="ex2">'+esc(c.ex)+'</span>':'')+'</div></div>'}).join('');
  ll.querySelectorAll('.sp').forEach(function(b){b.onclick=function(){speak(b.dataset.en)}});
}

/* ============ FEEDBACK ============ */
function renderFeedback(){
  var v=$('#view-feedback');
  var ok=/^https?:\/\//.test(FEEDBACK_SHEET_URL);
  v.innerHTML='<h1 class="large-title">Signaler</h1>'+
   '<p class="subtitle">Un mot manque, une traduction est fausse, une coquille ? Signale-le pour qu\u2019on compl\u00e8te la liste commune.</p>'+
   '<div class="fb-card"><p style="margin:0">La feuille de signalement s\u2019ouvre dans un nouvel onglet. Pas besoin de compte.</p>'+
   '<ol class="steps"><li>Clique sur <b>Ouvrir la feuille</b>.</li><li>Ajoute une ligne : le <b>mot</b> + un <b>d\u00e9tail</b> (exemple, traduction).</li><li>C\u2019est enregistr\u00e9 automatiquement.</li></ol>'+
   (ok?'<a class="btn primary block lg" href="'+esc(FEEDBACK_SHEET_URL)+'" target="_blank" rel="noopener">Ouvrir la feuille</a>'
      :'<button class="btn block lg" disabled>Lien \u00e0 configurer</button>')+
   '</div>';
}

/* ============ THEME ============ */
(function(){
  var t=null;try{t=localStorage.getItem(LS_THEME)}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  var btn=$('#themeBtn');btn.innerHTML=IC.sun;
  btn.onclick=function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    var nx=dark?'light':'dark';
    document.documentElement.setAttribute('data-theme',nx);
    try{localStorage.setItem(LS_THEME,nx)}catch(e){}
  };
})();

/* ============ BOOT ============ */
buildTabs();
show('home');
</script>
